<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1FD15" />
      <stop offset="100%" stop-color="#9500FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#E1FD15" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background circle for high visibility in dark/light browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0B0C10" />
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#9500FF" stroke-width="1.5" opacity="0.6" />

  <!-- Inline Skate Graphic -->
  <g transform="translate(2, 2)">
    <!-- Skate Boot (High-cut Urban / Freeskate Boot) -->
    <!-- Cuff & Ankle -->
    <path d="M 23 8 L 35 10 C 37 10 39 12 39 15 L 38 23 C 39 24 40 26 40 28 L 47 34 C 49 36 49 39 47 41 L 43 43 C 41 44 38 44 35 44 L 17 44 C 15 44 14 42 14 40 L 15 28 C 15 25 16 22 18 19 L 20 10 C 21 8 22 8 23 8 Z" fill="#1C1F26" stroke="#E1FD15" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Boot Accents / Straps -->
    <!-- Top Cuff Buckle -->
    <rect x="22" y="14" width="16" height="3.5" rx="1.5" fill="#9500FF" stroke="#E1FD15" stroke-width="0.8" />
    
    <!-- 45-degree Instep Powerstrap -->
    <path d="M 23 27 L 35 33" stroke="#E1FD15" stroke-width="2.5" stroke-linecap="round" />

    <!-- Heel / Sole plate -->
    <path d="M 14 41 L 45 41 C 46 41 47 42 47 43 L 45 45 L 14 45 Z" fill="#E1FD15" />

    <!-- Aluminum Wheel Frame (Chassis) -->
    <path d="M 10 45 L 50 45 C 51 45 52 46 52 48 L 8 48 C 8 46 9 45 10 45 Z" fill="#9500FF" />
    
    <!-- Axle Frame Bridges -->
    <path d="M 10 47 L 50 47" stroke="#E1FD15" stroke-width="1.2" />

    <!-- 4 Inline Wheels (Front to Back) -->
    <!-- Wheel 1 (Rear) -->
    <circle cx="13" cy="52" r="5.5" fill="#E1FD15" stroke="#0B0C10" stroke-width="1.2" filter="url(#glow)" />
    <circle cx="13" cy="52" r="2" fill="#0B0C10" />
    <circle cx="13" cy="52" r="0.8" fill="#9500FF" />

    <!-- Wheel 2 -->
    <circle cx="24" cy="52" r="5.5" fill="#E1FD15" stroke="#0B0C10" stroke-width="1.2" filter="url(#glow)" />
    <circle cx="24" cy="52" r="2" fill="#0B0C10" />
    <circle cx="24" cy="52" r="0.8" fill="#9500FF" />

    <!-- Wheel 3 -->
    <circle cx="35" cy="52" r="5.5" fill="#E1FD15" stroke="#0B0C10" stroke-width="1.2" filter="url(#glow)" />
    <circle cx="35" cy="52" r="2" fill="#0B0C10" />
    <circle cx="35" cy="52" r="0.8" fill="#9500FF" />

    <!-- Wheel 4 (Front) -->
    <circle cx="46" cy="52" r="5.5" fill="#E1FD15" stroke="#0B0C10" stroke-width="1.2" filter="url(#glow)" />
    <circle cx="46" cy="52" r="2" fill="#0B0C10" />
    <circle cx="46" cy="52" r="0.8" fill="#9500FF" />
  </g>
</svg>
